name: 部署到MDBGO

on:
  schedule:
    - cron: '0 0 1,11,21 * *'  # 1st, 11th, 21st of each month
  workflow_dispatch:
  push:
    branches: [ main ]

# 自动设置权限 - 无需在GitHub Settings中手动配置
permissions:
  contents: write      # 允许写入仓库内容（提交、推送等）
  actions: read        # 允许读取Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: 安装MDBGO CLI
        run: npm install -g mdb-cli
      
      - name: 登录MDBGO
        env:
          MDBGO_USERNAME: ${{ secrets.MDBGO_USERNAME }}
          MDBGO_PASSWORD: ${{ secrets.MDBGO_PASSWORD }}
        run: |
          mdb login --username "$MDBGO_USERNAME" --password "$MDBGO_PASSWORD"
      
      - name: 安装系统依赖
        run: sudo apt-get install -y xsel

      - name: 部署项目
        run: mdb publish
      
      - name: 部署成功
        if: success()
        run: echo "✅ 项目已成功部署到MDBGO"
      
      - name: 部署失败通知
        if: failure()
        run: echo "❌ 部署失败,请检查日志"
      
      - name: 记录运行时间
        if: always()
        run: |
          # 获取当前时间和状态
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          STATUS="${{ job.status }}"
          TRIGGER="${{ github.event_name }}"
          
          # 格式化输出
          echo "[$TIMESTAMP] 触发方式: $TRIGGER | 状态: $STATUS" >> time.txt
      
      - name: 配置Git用户信息
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
      
      - name: 提交时间记录
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add time.txt
          if git diff --cached --quiet; then
            echo "✓ 没有新的更改，跳过提交"
          else
            git commit -m "自动记录部署运行时间 [$(date '+%Y-%m-%d %H:%M:%S')]"
            git push origin main
            echo "✓ 时间记录已成功提交"
          fi
